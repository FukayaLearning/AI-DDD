schema: spec-driven

context: |
  Project: AI-DDD (OpenSpec x DDD Platform)
  Git Workflow (omit/skip if the repository is not under Git control):
    - Before starting Task 1 in openspec-apply, check git status, ask the user to confirm creating/switching to a working branch (e.g., feat/<change-name>), and commit the pre-task (post-propose) planning artifacts to that branch.
    - Commit once per completed task (including its tasks.md checkbox update) before proceeding to the next task.

rules:
  tasks:
    - "Under Git control (skip if not a Git repository): commit the post-propose baseline after confirming the working branch before Task 1, and commit once per completed task"

operations:
  apply:
    guidance:
      - "If the repository is under Git control (skip if not a Git repository): before starting the first task in openspec-apply, ask the user to confirm creating/switching to a working branch and commit the pre-task (post-propose) artifacts to that branch"
      - "If under Git control: commit after completing each individual task (including its tasks.md checkbox update) before proceeding to the next task"
